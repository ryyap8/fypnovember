<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Failed - FoodRoutes</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="/css/email-verification-error.css">
</head>

<body>

    <div class="verification-container">

        <!-- Logo -->
        <div class="logo">
            FoodRoutes
        </div>

        <!-- Error Icon -->
        <div class="error-circle">
            !
        </div>

        <!-- Title -->
        <h1>
            Verification Failed
        </h1>

        <!-- Message -->
        <p class="message">
            This email verification link is invalid or has expired.
            Please register again or request a new verification link.
        </p>

        <!-- Register Button -->
        <a href="/register.html" class="register-button">
            Back to Register
        </a>

        <!-- Login Option -->
        <p class="login-text">
            Already have an account?
            <a href="/login.html">Login here</a>
        </p>

        <!-- Bottom Text -->
        <div class="small-text">
            FoodRoutes
        </div>

    </div>

</body>

</html>
